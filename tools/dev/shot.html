.f{background:#fff}iframe{border:0;display:block}</style></head><body>
<script>
const q=new URLSearchParams(location.search);
const page=q.get('page')||'index.html', lang=q.get('lang')?('?lang='+q.get('lang')):'';

document.write([390,768,1440].map(w=>
 `<div><div>${w} · ${page} ${lang}</div><div class="f"><iframe src="/v2/${page}${lang}" style="width:${w}px;height:${h}px"></iframe></div></div>`).join(''));
</script>
